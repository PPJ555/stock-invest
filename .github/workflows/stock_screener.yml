name: Daily Stock Screener Pipeline

on:
  schedule:
    # UTC 07:30 代表台灣時間 (UTC+8) 下午 15:30 (每週一至週五)
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 支援手動按鈕觸發執行

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v3

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安裝 Python 套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: 4. 執行選股與買賣點計算
        env:
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
        run: python screener.py

      - name: 5. 將選股結果提交回 GitHub (自動更新 Pages 網站)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add daily_picks.json
          git commit -m "Auto update daily picks [skip ci]" || exit 0
          git push
